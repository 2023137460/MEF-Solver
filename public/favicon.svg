<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="14" fill="url(#grad)" />
  <!-- Structural Truss Triangle -->
  <polygon points="32,14 14,48 50,48" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" fill="none" />
  <line x1="32" y1="14" x2="32" y2="48" stroke="#93c5fd" stroke-width="3" stroke-dasharray="3 2" />
  <!-- Nodes -->
  <circle cx="32" cy="14" r="5" fill="#ef4444" stroke="#ffffff" stroke-width="2.5" />
  <circle cx="14" cy="48" r="4.5" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
  <circle cx="50" cy="48" r="4.5" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
</svg>
